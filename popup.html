<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub 한국어+</title>
<style>
:root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}body{margin:0;width:330px;background:#0d1117;color:#e6edf3}.wrap{padding:16px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand img{width:38px;height:38px;border-radius:9px}.title{font-size:17px;font-weight:700}.sub{font-size:11px;color:#8b949e;margin-top:2px}.card{border:1px solid #30363d;border-radius:10px;overflow:hidden;background:#161b22}.row{display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border-bottom:1px solid #21262d}.row:last-child{border-bottom:0}.label{font-size:13px;font-weight:600}.desc{font-size:11px;color:#8b949e;margin-top:2px;max-width:235px;line-height:1.4}.switch{position:relative;width:38px;height:22px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:20px;background:#30363d;cursor:pointer;transition:.15s}.slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#f0f6fc;transition:.15s}.switch input:checked+.slider{background:#238636}.switch input:checked+.slider:before{transform:translateX(16px)}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:11px;color:#8b949e}.status{color:#3fb950;font-weight:600}.reload{margin-top:10px;width:100%;border:1px solid #30363d;background:#21262d;color:#e6edf3;border-radius:8px;padding:8px 10px;font-weight:600;cursor:pointer}.reload:hover{background:#30363d}</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="icons/icon48.png" alt=""><div><div class="title">GitHub 한국어+</div><div class="sub">빠르고 안전한 로컬 GitHub 한국어 번역</div></div></div>
  <div class="card">
    <div class="row"><div><div class="label">한국어 번역</div><div class="desc">GitHub 인터페이스를 한국어로 표시합니다.</div></div><label class="switch"><input id="useTranslation" type="checkbox"><span class="slider"></span></label></div>
    <div class="row"><div><div class="label">영문 개발 용어에 가까운 표현 사용</div><div class="desc">켜면 저장소→리포지토리, 분기→브랜치, 끌어오기 요청→풀 리퀘스트처럼 개발 현장에서 자주 쓰는 표현으로 바꿉니다.</div></div><label class="switch"><input id="useDevTerms" type="checkbox"><span class="slider"></span></label></div>
    <div class="row"><div><div class="label">한국어 조사 자동 보정</div><div class="desc">번역된 문장의 은/는, 이/가, 을/를 등을 자연스럽게 보정합니다.</div></div><label class="switch"><input id="useParticles" type="checkbox"><span class="slider"></span></label></div>
    <div class="row"><div><div class="label">성능 로그</div><div class="desc">문제 분석용 DOM 번역 처리 시간을 개발자 콘솔에 기록합니다.</div></div><label class="switch"><input id="useLogs" type="checkbox"><span class="slider"></span></label></div>
  </div>
  <div class="foot"><span>v0.1.3 · 외부 번역 서버 사용 안 함</span><span id="status" class="status">활성</span></div>
</div>
<script src="popup.js"></script>
</body>
</html>
